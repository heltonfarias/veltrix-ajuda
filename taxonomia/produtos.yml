# Produtos atendidos pela central. O slug é o prefixo da URL
# (ajuda.veltrixlabs.com.br/<slug>) e dos featureIds (<slug>.<modulo>.<tela>).
- slug: one
  nome: VeltrixOne
  repositorio: heltonfarias/veltrixone
  descricao: Para confecções e indústrias com produção própria — gestão completa com controle de lotes e rastreabilidade.
  frontend: packages/frontend/src
  backend_modulos: packages/backend/src/modules
  menu: [packages/frontend/src/components/Sidebar.tsx]

