# Valida todo PR de conteúdo. A publicação só acontece no merge em main,
# que exige a aprovação do usuário master (CODEOWNERS + proteção de branch).
name: conteudo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # republicar manualmente (Actions › conteudo › Run workflow)

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Validar artigos
        run: npx tsx cli/index.ts validar
      - name: Cobertura
        run: npx tsx cli/index.ts cobertura --saida cobertura.md && cat cobertura.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build do site (com rascunhos, para pegar erro de página em PR)
        working-directory: site
        env:
          AJUDA_RASCUNHOS: '1'
        run: npm ci --no-audit --no-fund && npm run build

  publicar:
    # Deploy da central no Coolify (o Coolify faz o build pelo Dockerfile).
    # Ligado quando a variável de repositório PUBLICAR=true e os segredos
    # COOLIFY_DEPLOY_WEBHOOK e COOLIFY_TOKEN estiverem cadastrados.
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLICAR == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Coolify
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
